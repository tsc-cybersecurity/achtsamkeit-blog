<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px;
    height: 2400px;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Georgia, 'Times New Roman', serif;
    color: #e8d5b7;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .circle {
    position: absolute;
    top: 15%;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,213,183,0.3) 0%, transparent 70%);
  }
  .title {
    font-size: 72px;
    line-height: 1.2;
    margin: 320px 120px 0;
    letter-spacing: 2px;
    font-weight: normal;
  }
  .subtitle {
    font-size: 36px;
    margin: 40px 120px 0;
    font-style: italic;
    opacity: 0.8;
    letter-spacing: 1px;
  }
  .author {
    position: absolute;
    bottom: 12%;
    font-size: 32px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .ornament {
    margin-top: 60px;
    font-size: 48px;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="circle"></div>
  <div class="title">Achtsamkeit, Meditation<br>und Spiritualität</div>
  <div class="subtitle">Ein Wegweiser zur inneren Stille</div>
  <div class="ornament">✦</div>
  <div class="author">Nordstern Verlag</div>
</body>
</html>
