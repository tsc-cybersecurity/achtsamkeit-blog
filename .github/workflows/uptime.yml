name: Uptime Check

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site availability
        run: |
          SITE_URL="${{ vars.SITE_URL || 'https://achtsamkeit-blog.vercel.app' }}"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 "$SITE_URL")
          echo "Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Site returned HTTP $STATUS"
            exit 1
          fi
          echo "Site is up and healthy"
